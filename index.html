<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleSocial - Connect & Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">📱 SimpleSocial</h1>
                <div class="user-info">
                    <span class="username" id="currentUser">Guest User</span>
                    <button class="btn-secondary" id="changeUserBtn">Change User</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Create Post Section -->
            <div class="create-post-card">
                <div class="user-avatar">👤</div>
                <div class="create-post-input">
                    <textarea
                        id="postInput"
                        placeholder="What's on your mind?"
                        rows="3"
                    ></textarea>
                    <div class="create-post-actions">
                        <div class="post-options">
                            <span class="post-option">📷 Photo</span>
                            <span class="post-option">😊 Feeling</span>
                        </div>
                        <button class="btn-primary" id="postBtn">Post</button>
                    </div>
                </div>
            </div>

            <!-- Filter Options -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All Posts</button>
                <button class="filter-btn" data-filter="my">My Posts</button>
                <button class="filter-btn" data-filter="liked">Liked</button>
            </div>

            <!-- Posts Feed -->
            <div id="postsFeed" class="posts-feed">
                <!-- Posts will be dynamically added here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>
                <h3>No posts yet</h3>
                <p>Be the first to share something!</p>
            </div>
        </main>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2>Change Username</h2>
            <input
                type="text"
                id="usernameInput"
                placeholder="Enter your username"
                maxlength="20"
            >
            <div class="modal-actions">
                <button class="btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn-primary" id="saveUserBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
